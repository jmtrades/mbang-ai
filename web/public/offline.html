<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Offline</title>
<style>
  :root { --bg:#fbfbfc; --panel:#fff; --ink:#17171a; --muted:#64646e; --line:#e4e4e8; --brand:#5b6cff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e11; --panel:#151518; --ink:#ececef; --muted:#9696a1; --line:#26262b; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:360px; padding:32px 24px; text-align:center; }
  .mark { width:44px; height:44px; margin:0 auto 16px; border-radius:12px; display:grid; place-items:center; color:#fff;
          background:linear-gradient(140deg, #8794ff, var(--brand) 45%, #3a47b8); font-weight:600; }
  h1 { font-size:20px; letter-spacing:-0.02em; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 20px; }
  button { font:inherit; font-weight:500; height:36px; padding:0 16px; border-radius:9px; border:1px solid var(--line);
           background:var(--panel); color:var(--ink); cursor:pointer; }
  button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
</style>
<body>
<main>
  <div class="mark" aria-hidden="true">O</div>
  <h1>You're offline</h1>
  <p>The app shell is installed. Your workspace will reload when the connection is back.</p>
  <button onclick="location.reload()">Retry</button>
</main>
</body>
</html>
