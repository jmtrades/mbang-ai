<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Toast — preview</title>
<style>html,body{margin:0;background:var(--bg);color:var(--ink)} body{padding:16px} .op-root{font-family:var(--font-sans)}</style></head>
<body><div id="root" class="op-root"></div>
<script>
var O = window.Operator, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h("div", {className:"op-col", style:{alignItems:"flex-end"}},
  h(O.Toast, {tone:"good"}, "Approved — now send it yourself and mark it sent"),
  h(O.Toast, {tone:"info"}, "Link code ready. It works for an hour."),
  h(O.Toast, {tone:"bad"}, "Couldn't change that. Try again.")
));
</script></body></html>
