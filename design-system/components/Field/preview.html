<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Field — preview</title>
<style>html,body{margin:0;background:var(--bg);color:var(--ink)} body{padding:16px} .op-root{font-family:var(--font-sans)}</style></head>
<body><div id="root" class="op-root"></div>
<script>
var O = window.Operator, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById('root')).render(h("div", {style:{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, maxWidth:720}},
  h("div", {className:"op-col"},
    h(O.Field, {label:"Brand name", hint:"Shown in the sidebar and on every student's screen."}, h(O.Input, {defaultValue:"Operator AI"})),
    h(O.Field, {label:"Reply channel"}, h(O.Select, {options:["Instagram DM","Email","SMS (needs opt-in)"], defaultValue:"Instagram DM"})),
    h(O.Field, {label:"Daily opener cap", hint:"Five thoughtful conversations a day per sender."}, h(O.Input, {type:"number", defaultValue:5, disabled:true}))),
  h(O.Field, {label:"Approval note", hint:"Kept in the audit log with your decision."}, h(O.TextArea, {placeholder:"Why this draft was changed…", rows:7}))
));
</script></body></html>
